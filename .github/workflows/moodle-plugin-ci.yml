name: Moodle Plugin CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Moodle ${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04

    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd="${{ matrix.healthcmd }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: '5.0'
            moodlebranch: MOODLE_500_STABLE
            php: '8.2'
            database: pgsql
            image: postgres:14
            port: 5432
            healthcmd: pg_isready
          - moodle: '5.0'
            moodlebranch: MOODLE_500_STABLE
            php: '8.4'
            database: mariadb
            image: mariadb:10.11
            port: 3306
            healthcmd: mariadb-admin ping
          - moodle: '5.1'
            moodlebranch: MOODLE_501_STABLE
            php: '8.2'
            database: pgsql
            image: postgres:15
            port: 5432
            healthcmd: pg_isready
          - moodle: '5.1'
            moodlebranch: MOODLE_501_STABLE
            php: '8.4'
            database: mariadb
            image: mariadb:10.11
            port: 3306
            healthcmd: mariadb-admin ping
          - moodle: '5.2'
            moodlebranch: MOODLE_502_STABLE
            php: '8.3'
            database: pgsql
            image: postgres:16
            port: 5432
            healthcmd: pg_isready
          - moodle: '5.2'
            moodlebranch: MOODLE_502_STABLE
            php: '8.4'
            database: mariadb
            image: mariadb:10.11
            port: 3306
            healthcmd: mariadb-admin ping

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodlebranch }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin structure
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache
